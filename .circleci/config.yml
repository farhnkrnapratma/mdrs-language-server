version: 2.1

executors:
    node:
        docker:
            - image: cimg/node:24.22
        resource_class: medium

commands:
    setup-bun:
        steps:
            - run:
                  name: Install bun
                  command: |
                      curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.5"
                      ln -sf "$HOME/.bun/bin/bun" "$HOME/.bun/bin/bunx"
                      echo 'export PATH="$HOME/.bun/bin:$PATH"' >> "$BASH_ENV"
    install:
        steps:
            - checkout
            - setup-bun
            - restore_cache:
                  keys:
                      - bun-v1-{{ checksum "bun.lock" }}
                      - bun-v1-
            - run: bun install --frozen-lockfile
            - save_cache:
                  key: bun-v1-{{ checksum "bun.lock" }}
                  paths:
                      - ~/.bun/install/cache

jobs:
    test:
        executor: node
        steps:
            - install
            - run: bun run typecheck
            - run:
                  name: Run tests with a 100% line and function coverage gate
                  command: bun run coverage
            - store_artifacts:
                  path: coverage
            - run:
                  name: Upload coverage to Codecov
                  command: |
                      if [ -z "${CODECOV_TOKEN:-}" ]; then echo "CODECOV_TOKEN is not set; skipping the upload."; exit 0; fi
                      curl -fsSL -o codecov https://cli.codecov.io/v11.3.2/linux/codecov
                      echo "8e1bfb71661378530f6ea21e82b414095899e565cbb4cf555c613064be17b973  codecov" | sha256sum -c -
                      chmod +x codecov
                      ./codecov upload-process --fail-on-error --disable-search --git-service github \
                          --slug farhnkrnapratma/mdrs-language-server --file coverage/lcov.info
            - run: bun run build
            - run:
                  name: Run the stdio test against the Node build
                  command: MDRS_LS_NODE=1 bun test test/server.test.ts
    lint:
        executor: node
        steps:
            - install
            - run: bunx biome ci .
    commitlint:
        executor: node
        steps:
            - install
            - run:
                  name: Lint commit messages
                  command: |
                      if [ -n "$CIRCLE_PULL_REQUEST" ]; then
                          bunx commitlint --from "$(git merge-base origin/main HEAD)" --to HEAD
                      else
                          bunx commitlint --from HEAD~1 --to HEAD
                      fi

workflows:
    ci:
        jobs:
            - lint
            - test:
                  context: codecov
            - commitlint
